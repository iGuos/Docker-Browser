[package]
name = "docker-browser"
version = "0.1.0"
description = "Docker Browser — Tauri desktop client for local Docker Engine management"
authors = ["Guo's"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "docker_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Docker API
bollard = { version = "0.18", features = ["ssl"] }

# PTY for container exec
portable-pty = "0.8"

# Tar for container filesystem
tar = "0.4"
flate2 = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
dashmap = "6"
anyhow = "1"
bytes = "1"
base64 = "0.22"
log = "0.4"
sysinfo = "0.35"

[features]
custom-protocol = ["tauri/custom-protocol"]
