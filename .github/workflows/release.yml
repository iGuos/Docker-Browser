# 推送以 v 开头的 tag（如 v0.1.0）时：用 tauri-action 在 Windows / macOS / Linux 上打包并创建 GitHub Release。
# tag 自动写入 package.json / src-tauri/Cargo.toml / src-tauri/tauri.conf.json 的 version 字段。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-latest
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri Linux deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev

      - run: pnpm install --frozen-lockfile

      - name: Sync version from git tag
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/sync-version-from-tag.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Docker Browser ${{ github.ref_name }}'
          releaseBody: |
            See assets below to download and install.

            **macOS users**: This release is not Apple-notarized. If macOS reports "app is damaged", clear the quarantine attribute:
            ```bash
            sudo xattr -r -d com.apple.quarantine "/Applications/Docker Browser.app"
            ```
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
