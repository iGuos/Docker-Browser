# 推送 / PR：前端类型检查 + 测试构建 + Vitest，并编译 Rust（Tauri）后端。
# 安装包仅在打 tag 时由 Release 工作流构建（见 release.yml）。
name: CI

on:
  push:
    branches: [main, master, tauri-migration]
  pull_request:
    branches: [main, master, tauri-migration]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test build (Vite, mode=test)
        run: pnpm run pretest

      - name: Vitest (unit)
        run: pnpm exec vitest run

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install
        run: pnpm install --frozen-lockfile

      # generate_context! 需要前端产物存在
      - name: Build frontend
        run: pnpm build

      - name: Cargo build
        run: cargo build --manifest-path src-tauri/Cargo.toml
